<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimi K3 架构 3D 探索器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0a0f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #scene { width: 100%; height: 100%; display: block; }

  /* 右侧面板（默认隐藏） */
  #panel {
    position: fixed; top: 0; right: -400px; width: 380px; height: 100vh;
    background: rgba(15, 15, 25, 0.95); backdrop-filter: blur(30px);
    border-left: 1px solid rgba(255, 255, 255, 0.08);
    transition: right 0.3s ease; z-index: 200;
    overflow-y: auto; padding: 24px;
  }
  #panel.open { right: 0; }
  #panelClose {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    border: none; background: rgba(255, 255, 255, 0.1);
    color: #fff; font-size: 18px; cursor: pointer;
  }

  /* 标题 */
  #title {
    position: fixed; top: 24px; left: 24px; z-index: 100;
    color: #fff; font-size: 18px; font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  #subtitle {
    position: fixed; top: 52px; left: 24px; z-index: 100;
    color: rgba(255, 255, 255, 0.6); font-size: 14px;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="title">Kimi K3 架构 3D 探索器</div>
<div id="subtitle">点击组件查看详情 · 拖拽旋转 · 滚轮缩放</div>

<div id="panel">
  <button id="panelClose">×</button>
  <div id="panelContent"></div>
</div>

<script src="js/three.min.js"></script>
<script src="js/core/scene.js"></script>
<script src="js/core/camera.js"></script>
<script src="js/core/renderer.js"></script>
<script src="js/modules/token.js"></script>
<script src="js/modules/attention.js"></script>
<script src="js/modules/ffn.js"></script>
<script src="js/modules/moe.js"></script>
<script src="js/modules/output.js"></script>
<script src="js/modules/training.js"></script>
<script src="js/ui/panel.js"></script>
<script src="js/ui/controls.js"></script>
<script src="js/main.js"></script>
</body>
</html>
