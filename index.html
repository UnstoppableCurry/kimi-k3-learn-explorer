<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kimi K3 · 一个 token 的旅程</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0d13; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #scene { width: 100%; height: 100%; display: block; }

  #title {
    position: fixed; top: 22px; left: 24px; z-index: 100;
    color: #fff; font-size: 17px; font-weight: 600;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }
  #subtitle {
    position: fixed; top: 48px; left: 24px; z-index: 100;
    color: rgba(255, 255, 255, 0.5); font-size: 12.5px;
  }

  /* 底部字幕：当前阶段 + 真实数字 */
  #stageBox {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 100; max-width: 72vw; text-align: center; pointer-events: none;
  }
  #stageTitle {
    color: #fff; font-size: 19px; font-weight: 600;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
  }
  #caption {
    margin-top: 6px; color: rgba(255, 255, 255, 0.72); font-size: 14px;
    font-family: Menlo, monospace;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  }

  /* 右下控件 */
  #controls {
    position: fixed; right: 20px; bottom: 22px; z-index: 200;
    display: flex; gap: 8px; align-items: center;
  }
  #controls button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14);
    background: rgba(20, 24, 36, 0.8); color: #dfe4ee; font-size: 13px;
    cursor: pointer; backdrop-filter: blur(10px);
  }
  #controls button:hover { background: rgba(40, 48, 70, 0.9); }
  #controls label {
    color: rgba(255,255,255,0.65); font-size: 12.5px; cursor: pointer;
    display: flex; gap: 4px; align-items: center; user-select: none;
  }
  #controls input[type=range] {
    width: 96px; accent-color: #ffb84d; cursor: pointer;
  }
  #speedVal {
    color: #ffd9a0; font-family: Menlo, monospace; font-size: 12px;
    min-width: 30px; text-align: right;
  }

  /* 阶段导航：可点击跳转，当前阶段高亮 */
  #stageNav {
    position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
    z-index: 150; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    max-width: 86vw;
  }
  #stageNav .chip {
    padding: 5px 11px; border-radius: 14px; font-size: 12px; cursor: pointer;
    color: rgba(255,255,255,0.55); background: rgba(18, 22, 34, 0.72);
    border: 1px solid rgba(255,255,255,0.10); backdrop-filter: blur(8px);
    transition: all 0.25s; user-select: none;
  }
  #stageNav .chip:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  #stageNav .chip.active {
    color: #1a1206; background: #ffb84d; border-color: #ffb84d;
    font-weight: 600; box-shadow: 0 0 14px rgba(255, 184, 77, 0.45);
  }
  #stageNav .chip.done { color: rgba(255, 209, 102, 0.75); border-color: rgba(255, 209, 102, 0.3); }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="title">Kimi K3 · 一个 token 的旅程</div>
<div id="subtitle">输入 → 分词 → Embedding → 61 层 → 输出 · 拖拽旋转 / 滚轮缩放 / WASD+QE 移动</div>

<div id="stageNav"></div>

<div id="stageBox">
  <div id="stageTitle"></div>
  <div id="caption"></div>
</div>

<div id="controls">
  <label title="WASD 移动速度（单位/秒）">速度
    <input type="range" id="speedRange" min="0.5" max="10" step="0.5" value="2">
    <span id="speedVal">2.0</span>
  </label>
  <label><input type="checkbox" id="chkFollow" checked> 相机跟随</label>
  <button id="btnPrev">◀ 上一步</button>
  <button id="btnNext">下一步 ▶</button>
  <button id="btnPlay">⏸ 暂停</button>
  <button id="btnRestart">↺ 重播</button>
</div>

<script src="js/three.min.js"></script>
<script src="js/core/scene.js"></script>
<script src="js/core/camera.js"></script>
<script src="js/core/renderer.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/main.js"></script>
</body>
</html>
