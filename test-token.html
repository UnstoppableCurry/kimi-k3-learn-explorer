<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Token/Embedding 模块独立测试</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d13; }
  #hud {
    position: fixed; top: 12px; left: 14px; color: #cfd6e4; z-index: 10;
    font: 13px/1.6 "PingFang SC", sans-serif; pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  #hud b { color: #fff; font-size: 15px; }
</style>
</head>
<body>
<div id="hud"><b>Token / Embedding 模块</b><br>
彩色小球 = token · 彩色细线 = embedding 各维度（红正蓝负）<br>
旋转圆环 + 螺旋正弦管 = 位置编码 · 流动光点 = 数据流</div>
<script src="js/three.min.js"></script>
<script src="js/modules/token.js"></script>
<script>
(function () {
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0d13);
  scene.fog = new THREE.Fog(0x0b0d13, 25, 60);

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);

  // 样例数据：带真实 embedding 数值（16 维）
  function emb(seed) {
    var v = [];
    for (var d = 0; d < 16; d++) v.push(Math.sin(seed * 3.7 + d * 1.3) * 0.9);
    return v;
  }
  var data = {
    tokens: [
      { id: 11, text: '你', embedding: emb(1), position: 0 },
      { id: 23, text: '好', embedding: emb(2), position: 1 },
      { id: 5,  text: '，', embedding: emb(3), position: 2 },
      { id: 87, text: '世', embedding: emb(4), position: 3 },
      { id: 42, text: '界', embedding: emb(5), position: 4 }
    ]
  };

  TokenModule.init(scene, camera, renderer);
  TokenModule.show(data);

  // 简单轨道：鼠标拖拽旋转视角（测试页用，不属于模块）
  var dragging = false, px = 0, py = 0, az = 0, el = 0.32, dist = 15;
  function applyCam() {
    var r = dist;
    camera.position.set(
      Math.sin(az) * Math.cos(el) * r,
      Math.sin(el) * r + 1.5,
      Math.cos(az) * Math.cos(el) * r
    );
    camera.lookAt(0, 0, 0);
  }
  window.addEventListener('mousedown', function (e) { dragging = true; px = e.clientX; py = e.clientY; });
  window.addEventListener('mouseup', function () { dragging = false; });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    az -= (e.clientX - px) * 0.005; el = Math.max(-0.2, Math.min(1.2, el + (e.clientY - py) * 0.005));
    px = e.clientX; py = e.clientY; applyCam();
  });
  window.addEventListener('wheel', function (e) {
    dist = Math.max(6, Math.min(40, dist + e.deltaY * 0.02)); applyCam();
  });
  applyCam();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var last = performance.now();
  function loop(now) {
    var delta = Math.min(0.05, (now - last) / 1000);
    last = now;
    TokenModule.update(delta);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 供 Playwright 验证用
  window.__ready = true;
  window.__module = TokenModule;
})();
</script>
</body>
</html>
