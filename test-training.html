<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Training 模块独立测试</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f18; }
  #scene { position: fixed; inset: 0; }
  .bar {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    display: flex; gap: 8px; font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .bar button {
    background: rgba(20,26,38,.85); color: #dfe6f2; border: 1px solid #2c3650;
    border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .bar button.active { background: #2b62c4; border-color: #2b62c4; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="bar">
  <button data-stage="pretrain" class="active">预训练</button>
  <button data-stage="sft">SFT</button>
  <button data-stage="rl">RL</button>
</div>

<script src="js/three.min.js"></script>
<script src="js/modules/training.js"></script>
<script>
(function () {
  var canvas = document.getElementById('scene');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x0b0f18);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0b0f18, 28, 60);

  var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0.5, 9.5, 21.5);
  camera.lookAt(-1, 2.2, 0);

  // 光照：主光(带阴影) + 补光 + 轮廓光
  var key = new THREE.DirectionalLight(0xffffff, 2.4);
  key.position.set(8, 14, 10);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -18; key.shadow.camera.right = 18;
  key.shadow.camera.top = 18; key.shadow.camera.bottom = -18;
  key.shadow.bias = -0.0004;
  scene.add(key);
  scene.add(new THREE.AmbientLight(0x33405a, 1.2));
  var rim = new THREE.DirectionalLight(0x5a7bd6, 0.9);
  rim.position.set(-10, 6, -8);
  scene.add(rim);

  MODULE_TRAINING.init(scene, camera, renderer);

  var buttons = document.querySelectorAll('.bar button');
  var initialStage = (location.hash || '#pretrain').slice(1);
  buttons.forEach(function (b) {
    b.classList.toggle('active', b.dataset.stage === initialStage);
  });
  MODULE_TRAINING.show({ stage: initialStage });

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      buttons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      MODULE_TRAINING.show({ stage: btn.dataset.stage });
      window.__stage = btn.dataset.stage;
    });
  });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var last = performance.now();
  function loop(now) {
    var delta = (now - last) / 1000;
    last = now;
    MODULE_TRAINING.update(delta);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.__stage = initialStage;
  window.__ready = true;
})();
</script>
</body>
</html>
