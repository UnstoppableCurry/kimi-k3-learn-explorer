<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Output 模块独立测试</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; bottom: 14px; color: #64748b;
    font: 13px -apple-system, "PingFang SC", sans-serif; user-select: none;
  }
  #hud button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 6px; padding: 5px 12px; margin-right: 8px; cursor: pointer;
    font: 13px -apple-system, "PingFang SC", sans-serif;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">
  <button id="btnResample">↻ 重新采样</button>
  Output 模块：hidden state → W·h = logits → softmax → 采样
</div>
<script src="js/three.min.js"></script>
<script src="js/modules/output.js"></script>
<script>
(function () {
  var canvas = document.getElementById('scene');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f14);
  scene.fog = new THREE.Fog(0x0b0f14, 45, 90);

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(2, 15.5, 30);
  camera.lookAt(-1, 0.2, 0);

  // --- 光照：主光（投影）+ 天光补 + 轮廓光 ---
  var key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(8, 18, 12);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -26; key.shadow.camera.right = 26;
  key.shadow.camera.top = 20; key.shadow.camera.bottom = -12;
  key.shadow.bias = -0.0004;
  scene.add(key);
  scene.add(new THREE.HemisphereLight(0x8fb4d9, 0x1a2027, 0.55));
  var rim = new THREE.DirectionalLight(0x7dd3fc, 0.7);
  rim.position.set(-14, 8, -10);
  scene.add(rim);

  OUTPUT_MODULE.init(scene, camera, renderer);
  OUTPUT_MODULE.show();   // 无数据 → 自动生成演示 logits/probs/采样

  document.getElementById('btnResample').addEventListener('click', function () {
    OUTPUT_MODULE.show();   // 再来一组随机数据，重放完整动画
  });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var last = performance.now();
  (function loop(now) {
    var delta = Math.min(0.05, (now - last) / 1000);
    last = now;
    OUTPUT_MODULE.update(delta);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
</html>
